<form (ngSubmit)="saveProduct()" #productForm="ngForm">
    <div>
      <label>Name:</label>
      <input type="text" [(ngModel)]="product.name" name="name" required />
    </div>
  
    <div>
      <label>Description:</label>
      <textarea [(ngModel)]="product.description" name="description"></textarea>
    </div>
  
    <div>
      <label>Base Price:</label>
      <input type="number" step="0.01" [(ngModel)]="product.basePrice" name="basePrice" required />
    </div>
  
    <div>
      <label>Stock Quantity:</label>
      <input type="number" [(ngModel)]="product.stockQuantity" name="stockQuantity" required />
    </div>
  
    <div>
      <label>Created At:</label>
      <input type="datetime-local" [(ngModel)]="product.createdAt" name="createdAt" />
    </div>
  
    <div>
      <label>Updated At:</label>
      <input type="datetime-local" [(ngModel)]="product.updatedAt" name="updatedAt" />
    </div>
  
    <div>
      <label>Image URL:</label>
      <input type="text" [(ngModel)]="product.imageUrl" name="imageUrl" />
    </div>
  
    <button type="submit">Save</button>
  </form>
