    <!-- Shopping cart offcanvas -->
    <div class="offcanvas offcanvas-end pb-sm-2 px-sm-2" id="shoppingCart" tabindex="-1" aria-labelledby="shoppingCartLabel" style="width: 500px">

        <!-- Header -->
        <div class="offcanvas-header flex-column align-items-start py-3 pt-lg-4">
          <div class="d-flex align-items-center justify-content-between w-100 mb-3 mb-lg-4">
            <h4 class="offcanvas-title" id="shoppingCartLabel">Shopping cart</h4>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <p class="fs-sm">Buy <span class="text-dark-emphasis fw-semibold">$53</span> more to get <span class="text-dark-emphasis fw-semibold">Free Shipping</span></p>
          <div class="progress w-100" role="progressbar" aria-label="Free shipping progress" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100" style="height: 4px">
            <div class="progress-bar bg-dark rounded-pill d-none-dark" style="width: 78%"></div>
            <div class="progress-bar bg-light rounded-pill d-none d-block-dark" style="width: 78%"></div>
          </div>
        </div>
  
<!-- Items (Dynamic) -->
<div class="offcanvas-body d-flex flex-column gap-4 pt-2">
    <div class="d-flex align-items-center" *ngFor="let product of cartProducts">
      <a class="flex-shrink-0" href="#!">
        <img [src]="product.imageUrl" class="bg-body-tertiary rounded" width="110" alt="Thumbnail">
      </a>
      <div class="w-100 min-w-0 ps-3">
        <h5 class="d-flex animate-underline mb-2">
          <a class="d-block fs-sm fw-medium text-truncate animate-target" href="#!">
            {{ product.productName }}
          </a>
        </h5>
        <div class="h6 pb-1 mb-2">${{ product.price }}</div>
        <div class="d-flex align-items-center justify-content-between">
          <div class="count-input rounded-2">
            <button type="button" class="btn btn-icon btn-sm" (click)="decrementQuantity(product)">
              <i class="ci-minus"></i>
            </button>
            <input type="number" class="form-control form-control-sm" [value]="product.quantity" readonly>
            <button type="button" class="btn btn-icon btn-sm" (click)="incrementQuantity(product)">
              <i class="ci-plus"></i>
            </button>
          </div>
          <button type="button" class="btn-close fs-sm" (click)="removeFromCart(product)" aria-label="Remove from cart"></button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Footer -->
<div class="offcanvas-header flex-column align-items-start">
    <div class="d-flex align-items-center justify-content-between w-100 mb-3 mb-md-4">
      <span class="text-light-emphasis">Subtotal:</span>
      <span class="h6 mb-0">${{ totalAmount }}</span>
    </div>
    <div class="d-flex w-100 gap-3">
      <a class="btn btn-lg btn-secondary w-100" href="#!">View cart</a>
      <a class="btn btn-lg btn-dark w-100" href="#!">Checkout</a>
    </div>
  </div>
